name: Daily Quant Radar

on:
  schedule:
    # 台灣時間 06:00 (對應 UTC 22:00 前一天，每天執行)
    - cron: '0 22 * * *'
    # 台灣時間 16:00 (對應 UTC 08:00，每天執行)
    - cron: '0 8 * * *'
  workflow_dispatch: # 手動觸發按鈕

jobs:
# ... 後面的 jobs 區塊維持你原本的樣子不用動 ...
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Radar
        # 關鍵修正點：這裡必須精確對應你在 Secrets 設定的名稱
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
