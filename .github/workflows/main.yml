name: Daily Quant Radar

on:
  schedule:
    # 這是 cron 表示法，設定每天台灣時間 18:30 執行 (UTC 10:30)
    - cron: '30 10 * * 1-5'
  workflow_dispatch: # 這一行很重要，它讓你可以手動點擊「Run」來隨時測試

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Radar
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
